[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "intent-classifier"
version = "0.1.0"
description = "Two-stage intent-first conversational response engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.29.0",
    "pydantic>=2.12.0",
    "rich>=14.0.0",
]

[project.scripts]
intent-chat = "intent_classifier.cli:main"

[tool.uv]
package = true
